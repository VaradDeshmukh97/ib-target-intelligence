name: Import demonstration source
on:
  push:
    branches: [main]
    paths:
      - source_bundle.tar.gz.b64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        run: |
          base64 -d source_bundle.tar.gz.b64 > /tmp/portfolio-source.tar.gz
          mkdir -p /tmp/portfolio-source
          tar -xzf /tmp/portfolio-source.tar.gz -C /tmp/portfolio-source
          cp -R /tmp/portfolio-source/ib-target-intelligence/. .
          rm source_bundle.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete source tree"
          git push
