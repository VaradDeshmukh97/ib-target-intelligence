name: Import demonstration source
on:
  push:
    branches: [main]
    paths:
      - source_bundle.zip
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        run: |
          unzip -q source_bundle.zip -d /tmp/portfolio-source
          cp -R /tmp/portfolio-source/ib-target-intelligence/. .
          rm source_bundle.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete source tree"
          git push
